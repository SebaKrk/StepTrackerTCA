# CI — package and unit tests (scope: build + test, no signing, no secrets).
# Design decisions and risk register: context/foundation/infrastructure.md
# Pinned runner image (NOT macos-latest) — see "Unknown Unknowns" in the decision doc.
name: CI

on:
  push:
    branches: [develop, release]
  pull_request:
    branches: [develop, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Packages whose test bundle links on macOS — seconds, no simulator.
  spm-tests:
    name: spm-tests (${{ matrix.package }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [SharedModels]
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: ${{ matrix.package }}/.build
          key: spm-${{ matrix.package }}-${{ hashFiles(format('{0}/Package.resolved', matrix.package), format('{0}/Package.swift', matrix.package)) }}
          restore-keys: |
            spm-${{ matrix.package }}-

      - name: Swift version
        run: swift --version

      - name: Run tests
        run: swift test --package-path "${{ matrix.package }}"

  # Suites that need a simulator: the app target's reducer tests, and AppDatabase,
  # whose bundle cannot link on macOS (Sharing references a SwiftUICore symbol the
  # macOS build never emits). Minutes rather than seconds — a full build each.
  simulator-tests:
    name: simulator-tests (${{ matrix.name }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WorkoutMirrorLive
            directory: .
            arguments: >-
              -project MyFitnessJournal.xcodeproj
              -scheme WorkoutMirrorLive
              -only-testing:WorkoutMirrorLiveTests
          - name: AppDatabase
            directory: AppDatabase
            arguments: -scheme AppDatabase
    steps:
      - uses: actions/checkout@v4

      # The runner's installed devices change with the image, so the device is asked
      # for rather than pinned. Lowest-numbered plain iPhone: a foldable or a Pro Max
      # would run the suites just as well, but not reproducibly between images.
      - name: Pick an available iOS simulator
        id: simulator
        run: |
          device=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | contains("iOS")) | .value[]
                      | select(.isAvailable and (.name | startswith("iPhone")))]
                     | sort_by(.name) | .[0]')
          udid=$(echo "$device" | jq -r '.udid // empty')
          if [ -z "$udid" ]; then
            echo "No iPhone simulator on this image:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on $(echo "$device" | jq -r '.name')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: |
          xcodebuild test \
            ${{ matrix.arguments }} \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
