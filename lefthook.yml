# Pre-commit quality gate (M3L3): package test suites run on staged files.
# Catches what the per-edit agent hook missed — manual edits, files changed
# outside Claude Code. Heavier checks (app build, Cmd+U) stay above this
# layer: the user runs them, CI verifies packages on push/PR.
#
# A command is skipped when no staged file matches its glob, so commits that
# don't touch a package stay instant.

pre-commit:
  # Merge and rebase commits carry content already tested on the source
  # branch; re-running the suites there only blocks release back-merges.
  skip:
    - merge
    - rebase
  parallel: false
  commands:
    sharedmodels-tests:
      glob: "SharedModels/**/*.swift"
      run: DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer swift test --package-path SharedModels
    # DISABLED (2026-09-20). AppDatabaseTests cannot link on macOS: Sharing (via
    # SQLiteData) references its own `__generation: SwiftUI.State<Int>` symbol that
    # the macOS build never emits, so every commit touching AppDatabase failed here.
    # Verified dead ends: linking SwiftUI as an allowed client of SwiftUICore, and a
    # clean .build rebuild — the symbol stays undefined either way.
    #
    # It was worse than no gate: the only way past it is LEFTHOOK=0, which also
    # disables sharedmodels-tests, so a broken check was switching off a working one.
    # Package builds are still verified (`swift build --package-path AppDatabase`)
    # and the app build covers the rest. Re-enable once Sharing links on macOS,
    # or move this suite to an iOS Simulator destination in CI.
    #
    # appdatabase-tests:
    #   glob: "AppDatabase/**/*.swift"
    #   run: DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer swift test --package-path AppDatabase
